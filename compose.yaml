services:
  backend:
    build: ./Backend
    container_name: go-backend
    ports:
      - "3080:3080"
    volumes:
      - ./Backend:/app
      - /app/tmp
    networks:
      - app-network
    environment:
      - DB_HOST=postgresql      # Changed to match the service name below
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=Zeeshan@123
      - DB_NAME=dynamic-qr-code-db

  postgresql:
    image: postgres:16
    container_name: dynamic-qr-code-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Zeeshan@123
      - POSTGRES_DB=dynamic-qr-code-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: react-app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# THIS IS THE SECTION YOU NEED TO ADD:
volumes:
  postgres_data: